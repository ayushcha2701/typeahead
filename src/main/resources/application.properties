spring.application.name=typeahead

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Time decay: newFrequency = (frequency / factor) + todayCount
typeahead.decay.factor=10
# every day at midnight
typeahead.decay.cron=0 0 0 * * *
typeahead.trie.rebuild-ms=60000

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# Fail fast: with Redis down, a suggestion request should fall back to the local trie in milliseconds, not wait the 60s default
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
# Redis is only used as a key-value store here; skip repository scanning at startup
spring.data.redis.repositories.enabled=false

# Prefixes longer than this are not precomputed in Redis (served from the local trie instead)
typeahead.suggest.max-prefix-length=10